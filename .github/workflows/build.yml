name: Build Android app

on:
  workflow_dispatch:      # start it by hand with the "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # All the files sit in one folder on GitHub. Android wants them in a certain
      # folder tree, so we arrange them here. Every .kt file is picked up by itself,
      # so a new Kotlin file never needs a change here.
      - name: Arrange the files
        run: |
          mkdir -p app/src/main/java/org/nirobo/browser
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cp app-build.gradle.kts app/build.gradle.kts
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp *.kt app/src/main/java/org/nirobo/browser/
          cp blocklist.txt app/src/main/assets/blocklist.txt
          cp ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp ic_launcher_foreground.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cp ic_launcher_background.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_background.png
          cp ic_launcher_adaptive.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          # widget files: layout__x.xml becomes res/layout/x.xml, and so on
          mkdir -p app/src/main/res/layout app/src/main/res/xml app/src/main/res/drawable
          for f in layout__*.xml; do if [ -e "$f" ]; then cp "$f" "app/src/main/res/layout/${f#layout__}"; fi; done
          for f in xml__*.xml; do if [ -e "$f" ]; then cp "$f" "app/src/main/res/xml/${f#xml__}"; fi; done
          for f in drawable__*.xml; do if [ -e "$f" ]; then cp "$f" "app/src/main/res/drawable/${f#drawable__}"; fi; done
          # the app learns where to look for updates: this very repo
          echo "${{ github.repository }}" > app/src/main/assets/update_repo.txt

      # The signing key lives in two GitHub secrets (see SIGNING_SETUP.txt).
      - name: Get the signing key
        env:
          KEYSTORE_B64: ${{ secrets.NIROBO_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nirobo.keystore"
            echo "NIROBO_KEYSTORE=$RUNNER_TEMP/nirobo.keystore" >> "$GITHUB_ENV"
            echo "Signing with your own key."
          else
            echo "::warning::No signing key found. The app will build, but an update will not install over an older build. See SIGNING_SETUP.txt."
          fi

      - name: Build the app
        env:
          NIROBO_STORE_PASS: ${{ secrets.NIROBO_KEY_PASSWORD }}
          NIROBO_KEY_PASS: ${{ secrets.NIROBO_KEY_PASSWORD }}
          NIROBO_KEY_ALIAS: nirobo
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PappVersionCode=$((100 + GITHUB_RUN_NUMBER)) \
            -PappVersionName=1.0.${GITHUB_RUN_NUMBER}

      # The finished app goes on a "Release" page, together with version.json.
      # The app reads version.json to find out if a newer build exists.
      - name: Publish the app file and the update note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk nirobo-browser.apk
          SHA=$(sha256sum nirobo-browser.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s nirobo-browser.apk)
          CODE=$((100 + GITHUB_RUN_NUMBER))
          printf '{"versionCode":%s,"versionName":"1.0.%s","apk":"https://github.com/%s/releases/download/latest/nirobo-browser.apk","sha256":"%s","size":%s,"notes":"Build %s"}\n' \
            "$CODE" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "$SHA" "$SIZE" "$GITHUB_RUN_NUMBER" > version.json
          cat version.json
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest nirobo-browser.apk version.json --prerelease \
            --title "Nirobo Browser (latest build)" \
            --notes "Download nirobo-browser.apk below and install it on your Android phone. The app updates itself from here."
